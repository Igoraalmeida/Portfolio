<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Moldura quadrada arredondada no mesmo estilo dos outros icones -->
  <rect x="10" y="10" width="80" height="80" rx="8" ry="8" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Simbolo do Atomo do React -->
  <circle cx="50" cy="50" r="5.5" fill="#000000"/>
  <g fill="none" stroke="#000000" stroke-width="4">
    <ellipse cx="50" cy="50" rx="26" ry="10"/>
    <ellipse cx="50" cy="50" rx="26" ry="10" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="26" ry="10" transform="rotate(120 50 50)"/>
  </g>
</svg>
